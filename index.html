<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f1e7">
<title>Ноты на рояле</title>
<style>
:root{
  --paper:#f6f1e7;--card:#fffdf8;--ink:#1f1b16;--muted:#7a6f62;--line:#2a241d;
  --accent:#b4452b;--good:#2f7d4f;--bad:#c0392b;--gold:#c8962e;--soft:#ece4d4;--land:#2b6cb0;
  --key-w:#fffefb;--key-b:#1e1a16;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1814;--card:#24201b;--ink:#efe7da;--muted:#a89c8c;--line:#e9e0d2;
  --accent:#e0714f;--good:#5cbf84;--bad:#ef6a5a;--gold:#e0b04a;--soft:#2f2a23;--land:#6aa8ec;
  --key-w:#f4efe6;--key-b:#0f0d0b;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 28px}
h1{font:600 22px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 2px}
h2{font:600 18px/1.25 Georgia,serif;margin:18px 0 8px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.05),0 4px 14px rgba(60,40,10,.06)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:18px}
.btn.sec{background:var(--soft);color:var(--ink);font-weight:500;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--soft);font-size:15px}
.chip.on{background:var(--ink);color:var(--paper)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;background:none}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.stage{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin:4px 0;background:none;width:100%;text-align:left}
.stage.on{background:var(--soft)}
.stage .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;flex:none}
.stage.on .n{background:var(--accent);color:#fff}
.stage .t{flex:1}
.stage .t b{display:block;font-weight:600}
.stage .t span{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--good)}
.hide{display:none!important}
svg.staff{width:100%;height:auto;display:block}
.staff .ln{stroke:var(--line);stroke-width:1.3}
.staff .ink{fill:var(--line)}
.staff .clef{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
/* quiz */
.top{display:flex;align-items:center;gap:10px}
.top .x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:18px;flex:none}
.prog{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stat{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:64px;text-align:right}
.stafbox{background:var(--card);border-radius:16px;margin:10px 0;padding:4px 6px;transition:background .2s}
.stafbox.ok{background:color-mix(in srgb,var(--good) 16%,var(--card))}
.stafbox.no{background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.names{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.names button{padding:16px 0;border-radius:12px;background:var(--card);font-size:17px;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.08),0 2px 6px rgba(60,40,10,.08)}
.names button.ok{background:var(--good);color:#fff}
.names button.no{background:var(--bad);color:#fff}
.fb{min-height:52px;text-align:center;padding:6px 4px;font-size:16px}
.fb b{font-size:19px}
.fb .why{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.kbd{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin}
.kbd svg{display:block;height:150px}
.kbd .w{fill:var(--key-w);stroke:#6b6158;stroke-width:1}
.kbd .b{fill:var(--key-b)}
.kbd .w.ok,.kbd .b.ok{fill:var(--good)}
.kbd .w.no,.kbd .b.no{fill:var(--bad)}
.kbd .w.hint{fill:color-mix(in srgb,var(--land) 35%,var(--key-w))}
.kbd text{font-size:10px;fill:#6b6158;pointer-events:none}
.mic{text-align:center;padding:10px}
.mic .big{font:600 30px/1 Georgia,serif;min-height:34px}
.lvl{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:8px auto;max-width:240px}
.lvl i{display:block;height:100%;background:var(--accent);width:0}
.res{text-align:center}
.res .stars{font-size:40px;letter-spacing:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 div{background:var(--soft);border-radius:12px;padding:10px 4px}
.grid3 b{display:block;font-size:22px}
.grid3 span{font-size:12px;color:var(--muted)}
.tips li{margin:6px 0}
.small{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--soft);background:var(--paper);color:var(--ink);font:12px monospace;padding:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.next{margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">

<!-- HOME -->
<section id="home">
  <h1>Ноты на рояле</h1>
  <div class="sub">Тренажёр чтения нот по ориентирам — скрипичный и басовый ключ</div>

  <div class="card">
    <div class="row" id="profiles"></div>
    <div class="row" style="margin-top:10px;font-size:14px;color:var(--muted)" id="streak"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <h2 style="margin:0 0 6px">Уровни</h2><span class="small" id="stageHint"></span>
    </div>
    <div id="stages"></div>
  </div>

  <div class="card">
    <div class="small" style="margin-bottom:6px">Как отвечать</div>
    <div class="seg" id="modeSeg">
      <button data-m="names">Название</button>
      <button data-m="keys">Клавиша</button>
      <button data-m="mic">🎹 Живое пианино</button>
    </div>
    <div class="small" id="modeNote" style="margin-top:8px"></div>
    <div style="height:12px"></div>
    <button class="btn" id="startBtn">Начать · 20 нот</button>
    <div style="height:8px"></div>
    <button class="btn sec" id="introBtn">Показать ноты уровня</button>
  </div>

  <div class="row">
    <button class="chip" id="landBtn">📍 Ориентиры</button>
    <button class="chip" id="mapBtn">🗺 Карта нот</button>
    <button class="chip" id="howBtn">💡 Как учить</button>
    <button class="chip" id="setBtn">⚙︎ Настройки и данные</button>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="hide">
  <div class="top">
    <button class="x" id="quitBtn" aria-label="Выйти">✕</button>
    <div class="prog"><i id="progBar"></i></div>
    <div class="stat" id="qStat"></div>
  </div>
  <div class="stafbox" id="stafbox"><svg class="staff" id="qStaff"></svg></div>
  <div class="fb" id="fb"></div>
  <div id="ansNames" class="names"></div>
  <div id="ansKeys" class="kbd hide"></div>
  <div id="ansMic" class="mic hide">
    <div class="small" id="micState">Нажми клавишу на пианино</div>
    <div class="big" id="micNote">—</div>
    <div class="lvl"><i id="micLvl"></i></div>
    <button class="chip" id="micSkip">Не знаю — показать</button>
  </div>
  <button class="btn next hide" id="nextBtn">Понятно →</button>
</section>

<!-- RESULT -->
<section id="result" class="hide res">
  <h1 id="resTitle">Готово!</h1>
  <div class="stars" id="resStars"></div>
  <div class="grid3" style="margin:14px 0">
    <div><b id="resAcc"></b><span>верно</span></div>
    <div><b id="resTime"></b><span>медиана, сек</span></div>
    <div><b id="resFast"></b><span>быстрых ⚡</span></div>
  </div>
  <div class="card" style="text-align:left" id="resWeak"></div>
  <div class="card hide" style="text-align:left" id="resUnlock"></div>
  <button class="btn" id="againBtn">Ещё 20 нот</button>
  <div style="height:8px"></div>
  <button class="btn sec" id="homeBtn">На главную</button>
</section>

<!-- PAGES -->
<section id="page" class="hide">
  <div class="top"><button class="x" id="backBtn" aria-label="Назад">←</button><h1 id="pageTitle" style="margin:0"></h1></div>
  <div id="pageBody"></div>
</section>

</div>

<script>
"use strict";
/* ============ music model ============
   dia = diatonic number: octave*7 + letter (C=0 … B=6). C4 (middle C, «до первой октавы») = 28.
   An item is a note in a clef: {c:'T'|'B', d:dia}. Only white keys. */
const LET_RU=['до','ре','ми','фа','соль','ля','си'], LET_EN=['C','D','E','F','G','A','B'];
const OCT_RU=['субконтроктавы','контроктавы','большой октавы','малой октавы','первой октавы','второй октавы','третьей октавы','четвёртой октавы'];
const SEMI=[0,2,4,5,7,9,11];
const midiOf=d=>12*(Math.floor(d/7)+1)+SEMI[d%7];
const freqOf=m=>440*Math.pow(2,(m-69)/12);
const key=it=>it.c+it.d;
const parse=k=>({c:k[0],d:+k.slice(1)});
let S; // state
function letName(d,cap){const n=(S&&S.cfg.en?LET_EN:LET_RU)[d%7];return cap?n[0].toUpperCase()+n.slice(1):n}
function fullName(d){return letName(d,1)+' '+OCT_RU[Math.floor(d/7)]+(S.cfg.en?' ('+LET_EN[d%7]+Math.floor(d/7)+')':'')}

/* landmarks: the notes you learn first and read everything else from */
const LANDMARKS={T:[28,32,35,38,42,49],B:[7,14,18,21,24,28]};
const LAND_DESC={
  'T28':'до первой октавы — «среднее до», 1 добавочная внизу скрипичного',
  'T32':'соль первой — 2-я линейка, на ней «завиток» скрипичного ключа',
  'T35':'до второй — 3-й промежуток скрипичного',
  'T38':'фа второй — верхняя, 5-я линейка скрипичного',
  'T42':'до третьей — 2 добавочные сверху',
  'T49':'до четвёртой — 5 добавочных сверху (обычно пишут 8va)',
  'B28':'до первой — «среднее до», 1 добавочная сверху басового',
  'B24':'фа малой — 4-я линейка, между точками басового ключа',
  'B21':'до малой — 2-й промежуток басового',
  'B18':'соль большой — нижняя, 1-я линейка басового',
  'B14':'до большой — 2 добавочные снизу',
  'B7':'до контроктавы — 5 добавочных снизу (обычно пишут 8vb)'
};
const isLand=it=>LANDMARKS[it.c].includes(it.d);

/* stages — cumulative sets of items */
function rng(c,a,b){const r=[];for(let d=a;d<=b;d++)r.push({c,d});return r}
function near(c,lands,k){const r=[];for(const L of lands)for(let d=L-k;d<=L+k;d++)r.push({c,d});return r}
const STAGES=[
  {t:'Пять ориентиров',s:'До первой, соль первой, до второй, фа малой, до малой',
   items:()=>[{c:'T',d:28},{c:'T',d:32},{c:'T',d:35},{c:'B',d:28},{c:'B',d:24},{c:'B',d:21}]},
  {t:'Соседи ориентиров',s:'На шаг вверх и вниз от ориентира',
   items:()=>[...near('T',[28,32,35],1),...near('B',[21,24,28],1)]},
  {t:'Через одну',s:'Два шага от ориентира — почти весь нотоносец',
   items:()=>[...near('T',[28,32,35],2),...near('B',[21,24,28],2)]},
  {t:'Весь нотоносец + края',s:'Верхняя фа, нижняя соль, до третьей и до большой',
   items:()=>[...rng('T',28,40),{c:'T',d:42},...rng('B',16,28),{c:'B',d:14}]},
  {t:'Добавочные снаружи',s:'Высокие ноты над скрипичным и низкие под басовым',
   items:()=>[...rng('T',28,44),...rng('B',12,28)]},
  {t:'Добавочные посередине',s:'Та же нота в другом ключе: ля малой в скрипичном, ми первой в басовом',
   items:()=>[...rng('T',25,44),...rng('B',12,31)]},
  {t:'Крайние октавы',s:'До 5 добавочных линеек сверху и снизу',
   items:()=>[...rng('T',25,49),...rng('B',7,31)]},
];
function stageItems(i){const m=new Map();for(let s=0;s<=i;s++)for(const it of STAGES[s].items())m.set(key(it),it);return [...m.values()]}
function newInStage(i){const prev=i?new Set(stageItems(i-1).map(key)):new Set();return STAGES[i].items().filter(it=>!prev.has(key(it))).filter((it,j,a)=>a.findIndex(x=>key(x)===key(it))===j)}

/* ============ storage ============ */
const LS='pianoNotes_v1';
function blankProfile(name){return {name,stage:0,items:{},days:[],sessions:0,mode:'names'}}
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.profiles)return s}catch(e){}
  return {cur:0,profiles:[blankProfile('Папа'),blankProfile('Дочка')],cfg:{en:false,sound:true}}
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
S=load();S.cfg=S.cfg||{en:false,sound:true};
const P=()=>S.profiles[S.cur];
function rec(k){const p=P();return p.items[k]||(p.items[k]={box:0,seen:0,ok:0,rt:[]})}

/* ============ sound ============ */
let AC=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
function play(m,dur=1.4){
  if(!S.cfg.sound)return;const a=ac();if(!a)return;const t=a.currentTime,f=freqOf(m);
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);g.connect(a.destination);
  // simple piano-like tone: decaying harmonics, brighter in the treble, a little louder in the bass
  [1,2,3,4,5,6].forEach((h,i)=>{if(f*h>9000)return;const o=a.createOscillator(),og=a.createGain();o.frequency.value=f*h*(1+0.0004*h*h);
    og.gain.setValueAtTime((i?0.55/Math.pow(h,1.3):1)*(f<200?1.4:1),t);og.gain.exponentialRampToValueAtTime(.001,t+dur/(1+i*0.6));
    o.connect(og);og.connect(g);o.start(t);o.stop(t+dur)});
}
function blip(ok){if(!S.cfg.sound)return;const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(ok?880:220,t);if(ok)o.frequency.setValueAtTime(1320,t+.07);
  g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.25)}

/* ============ staff drawing ============ */
const SP=12, TT=78, BT=174, X0=6;            // line spacing, treble top line y, bass top line y
const yOf=it=>it.c==='T'?TT+(38-it.d)*SP/2:BT+(26-it.d)*SP/2;
function trebleClef(x){ // drawn so the spiral wraps the G line (TT+3*SP)
  const g=TT+3*SP, s=SP/13.5;
  const P=(a,b)=>`${(x+a*s).toFixed(1)},${(g+b*s).toFixed(1)}`;
  return `<path class="clef" stroke-width="2.4" d="M${P(4,44)} C${P(9,52)} ${P(19,47)} ${P(17,38)} L${P(9,-44)} C${P(8,-55)} ${P(21,-56)} ${P(19,-40)} C${P(17,-26)} ${P(-4,-14)} ${P(-5,4)} C${P(-6,18)} ${P(8,23)} ${P(15,18)} C${P(22,12)} ${P(19,-1)} ${P(10,-1)} C${P(4,-1)} ${P(2,6)} ${P(6,9)}"/>
  <circle class="ink" cx="${(x+3*s).toFixed(1)}" cy="${(g+43*s).toFixed(1)}" r="${(4*s).toFixed(1)}"/>`;
}
function bassClef(x){ // dot sits on the F line (BT+SP)
  const f=BT+SP, s=SP/11;const P=(a,b)=>`${(x+a*s).toFixed(1)},${(f+b*s).toFixed(1)}`;
  return `<circle class="ink" cx="${P(4,0).split(',')[0]}" cy="${f}" r="${(4.6*s).toFixed(1)}"/>
  <path class="ink" d="M${P(0,0)} C${P(0,-14)} ${P(13,-17)} ${P(19,-13)} C${P(28,-8)} ${P(28,8)} ${P(21,17)} C${P(14,26)} ${P(4,33)} ${P(-4,37)} C${P(6,30)} ${P(16,22)} ${P(19,12)} C${P(22,0)} ${P(18,-12)} ${P(10,-12)} C${P(5,-12)} ${P(2,-8)} ${P(0,0)} Z"/>
  <circle class="ink" cx="${(x+33*s).toFixed(1)}" cy="${(f-5*s).toFixed(1)}" r="${(2.4*s).toFixed(1)}"/>
  <circle class="ink" cx="${(x+33*s).toFixed(1)}" cy="${(f+5*s).toFixed(1)}" r="${(2.4*s).toFixed(1)}"/>`;
}
function ledgers(it,x,col){
  let out='',ds=[];
  if(it.c==='T'){for(let d=28;d>=it.d;d-=2)if(d<30)ds.push(d);for(let d=40;d<=it.d;d+=2)ds.push(d)}
  else{for(let d=28;d<=it.d;d+=2)if(d>26)ds.push(d);for(let d=16;d>=it.d;d-=2)ds.push(d)}
  // only even dia are lines in both clefs (treble lines E G B D F = 30..38, bass G B D F A = 18..26)
  ds=ds.filter(d=>d%2===0);
  for(const d of ds){const y=yOf({c:it.c,d});out+=`<line x1="${x-14}" x2="${x+14}" y1="${y}" y2="${y}" stroke="${col||'var(--line)'}" stroke-width="1.5"/>`}
  return out;
}
function noteHead(it,x,col,stem=true,label){
  const y=yOf(it),c=col||'var(--line)';
  let s=ledgers(it,x,col)+`<ellipse cx="${x}" cy="${y}" rx="7.6" ry="5.4" transform="rotate(-20 ${x} ${y})" fill="${c}"/>`;
  if(stem){const up=it.c==='T'?it.d<34:it.d<22;s+=up?`<line x1="${x+6.8}" x2="${x+6.8}" y1="${y-1.5}" y2="${y-36}" stroke="${c}" stroke-width="1.6"/>`
                                                  :`<line x1="${x-6.8}" x2="${x-6.8}" y1="${y+1.5}" y2="${y+36}" stroke="${c}" stroke-width="1.6"/>`}
  if(label)s+=`<text x="${x}" y="${it.c==='T'?Math.min(y-14,TT-8):Math.max(y+24,BT+4*SP+20)}" text-anchor="middle" font-size="11" fill="${c}" font-weight="600">${label}</text>`;
  return s;
}
function staffSVG(notes,opt={}){
  const W=opt.w||360;let s='';
  // fit the view to the notes shown (and to opt.fit, e.g. the whole pool, so the quiz staff keeps one size)
  const ys=[...notes,...(opt.fit||[])].map(yOf);
  const top=Math.min(TT-30,...ys.map(y=>y-46)), bot=Math.max(BT+4*SP+26,...ys.map(y=>y+46));
  for(let i=0;i<5;i++){s+=`<line class="ln" x1="${X0}" x2="${W-6}" y1="${TT+i*SP}" y2="${TT+i*SP}"/>`;s+=`<line class="ln" x1="${X0}" x2="${W-6}" y1="${BT+i*SP}" y2="${BT+i*SP}"/>`}
  s+=`<line class="ln" x1="${X0}" x2="${X0}" y1="${TT}" y2="${BT+4*SP}"/><line class="ln" x1="${W-6}" x2="${W-6}" y1="${TT}" y2="${BT+4*SP}"/>`;
  s+=trebleClef(X0+16)+bassClef(X0+12);
  for(const n of notes)s+=n.svg||noteHead(n,n.x||W/2,n.col,n.stem!==false,n.label);
  return {vb:`0 ${top} ${W} ${bot-top}`,html:s};
}
function drawStaff(el,notes,opt){const r=staffSVG(notes,opt);el.setAttribute('viewBox',r.vb);el.innerHTML=r.html}

/* ============ keyboard ============ */
function kbdSVG(dLo,dHi,opt={}){
  const KW=opt.kw||30,KH=opt.kh||150;let w='',b='',n=0;const pos={};
  for(let d=dLo;d<=dHi;d++){const x=n*KW;pos[d]=x;
    w+=`<rect class="w" data-d="${d}" x="${x+.5}" y=".5" width="${KW-1}" height="${KH-1}" rx="4"/>`;
    if(d%7===0)w+=`<text x="${x+KW/2}" y="${KH-8}" text-anchor="middle">${opt.lab?opt.lab(d):''}</text>`;
    n++}
  for(let d=dLo;d<dHi;d++){const l=d%7;if(l===2||l===6)continue;const x=pos[d]+KW*0.68;b+=`<rect class="b" x="${x}" y="0" width="${KW*0.64}" height="${KH*0.6}" rx="2"/>`}
  return {w:n*KW,h:KH,html:w+b,pos,KW};
}
function cLabel(d){const o=Math.floor(d/7);return ['','До к','До Б','до м','до¹','до²','до³','до⁴'][o]||''}

/* ============ selection & scheduling ============ */
function pickNext(pool,recent,forced){
  if(forced.length&&forced[0].at<=0){return forced.shift().it}
  const cand=pool.filter(it=>!recent.includes(key(it)));
  const W=cand.map(it=>{const r=P().items[key(it)];if(!r)return 6;           // unseen notes come up often
    const slow=r.rt.length&&median(r.rt)>3000?3:0, acc=r.seen?r.ok/r.seen:0;
    return 1+Math.pow(5-r.box,2)*0.6+slow+(1-acc)*4});
  let t=Math.random()*W.reduce((a,b)=>a+b,0);for(let i=0;i<cand.length;i++){t-=W[i];if(t<=0)return cand[i]}
  return cand[cand.length-1];
}
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function mastery(i){const its=stageItems(i);let m=0;for(const it of its){const r=P().items[key(it)];if(r&&r.box>=3)m++}return m/its.length}

/* ============ hint: nearest landmark + steps ============ */
function hintFor(it){
  const L=LANDMARKS[it.c].filter(d=>Math.abs(d-it.d)<=7);let best=null;
  for(const d of LANDMARKS[it.c]){if(best===null||Math.abs(d-it.d)<Math.abs(best-it.d))best=d}
  const diff=it.d-best;
  if(diff===0)return {land:best,text:'Это ориентир: '+LAND_DESC[it.c+best]};
  const st=Math.abs(diff),dir=diff>0?'вверх':'вниз';
  const how=st===2?'через одну (линейка→линейка или промежуток→промежуток)':st===1?'на соседнюю ступеньку':st+' ступени';
  return {land:best,text:`Ориентир — ${letName(best)} (${LAND_DESC[it.c+best].split(' — ')[1]}). От него ${dir} ${how} → ${letName(it.d)}`};
}

function streak(p){if(!p.days.length)return 0;let n=0;const d=new Date();

let Q=null, mic=null;
function startQuiz(){
  ac();const p=P();
  Q={pool:stageItems(p.stage),n:0,total:20,recent:[],forced:[],log:[],cur:null,t0:0,locked:false};
  show('quiz');setupAnswer();nextQ();
}
function setupAnswer(){
  const m=P().mode;
  $('ansNames').classList.toggle('hide',m!=='names');$('ansKeys').classList.toggle('hide',m!=='keys');$('ansMic').classList.toggle('hide',m!=='mic');
  if(m==='names'){$('ansNames').innerHTML=[0,1,2,3,4,5,6].map(l=>`<button data-l="${l}">${letName(l,1)}</button>`).join('');
    $('ansNames').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.l,'name'))}
  if(m==='keys'){const ds=Q.pool.map(x=>x.d),lo=Math.floor(Math.min(...ds)/7)*7,hi=Math.floor(Math.max(...ds)/7)*7+6;
    const k=kbdSVG(lo,hi,{lab:cLabel,kw:32});Q.kb=k;
    $('ansKeys').innerHTML=`<svg width="${k.w}" height="${k.h}" viewBox="0 0 ${k.w} ${k.h}">${k.html}</svg>`;
    $('ansKeys').querySelectorAll('.w').forEach(r=>r.onclick=()=>answer(+r.dataset.d,'key'));
    $('ansKeys').querySelectorAll('.b').forEach(r=>r.onclick=()=>{blip(false);toast('В тренажёре только белые клавиши')});
    requestAnimationFrame(()=>{const x=k.pos[28];$('ansKeys').scrollLeft=x-$('ansKeys').clientWidth/2+16})}
  if(m==='mic')startMic();
}
function nextQ(){
  if(Q.n>=Q.total){return finish()}
  Q.forced.forEach(f=>f.at--);
  const it=pickNext(Q.pool,Q.recent,Q.forced);Q.cur=it;Q.recent.push(key(it));if(Q.recent.length>2)Q.recent.shift();
  $('stafbox').className='stafbox';$('fb').innerHTML='&nbsp;';$('nextBtn').classList.add('hide');
  drawStaff($('qStaff'),[{...it,x:215}],{fit:Q.pool});
  $('progBar').style.width=(Q.n/Q.total*100)+'%';
  const ok=Q.log.filter(l=>l.ok).length;$('qStat').textContent=`${Q.n+1}/${Q.total} · ✓${ok}`;
  if(P().mode==='names')$('ansNames').querySelectorAll('button').forEach(b=>b.className='');
  if(P().mode==='keys')$('ansKeys').querySelectorAll('.w').forEach(r=>r.setAttribute('class','w'));
  if(P().mode==='mic'){$('micNote').textContent='—';$('micState').textContent='Сыграй эту ноту на пианино';if(mic)mic.armAt=performance.now()+350}
  Q.locked=false;Q.t0=performance.now();
}
function answer(v,kind,heardMidi){
  if(Q.locked)return;const it=Q.cur,rt=performance.now()-Q.t0;
  let ok;
  if(kind==='name')ok=(v===it.d%7);
  else if(kind==='key')ok=(v===it.d);
  else if(kind==='mic')ok=(heardMidi===midiOf(it.d));
  else ok=false; // skipped
  Q.locked=true;
  const r=rec(key(it));r.seen++;
  if(ok){r.ok++;r.rt.push(Math.round(rt));if(r.rt.length>6)r.rt.shift();r.box=rt<3000?Math.min(5,r.box+1):Math.max(1,r.box)}
  else{r.box=0;Q.forced.push({it,at:3})}   // a missed note comes back three notes later
  Q.log.push({k:key(it),ok,rt});Q.n++;
  save();
  const fast=ok&&rt<2000;
  if(P().mode!=='mic')play(midiOf(it.d));
  blip(ok);
  if(ok){
    $('stafbox').className='stafbox ok';
    drawStaff($('qStaff'),[{...it,x:215,col:'var(--good)'}],{fit:Q.pool});
    $('fb').innerHTML=`<b>${fullName(it.d)}</b> ${fast?'⚡':''}<span class="why">${(rt/1000).toFixed(1)} с</span>`;
    markAnswer(v,kind,true);
    setTimeout(()=>{if(Q&&Q.locked&&$('quiz').offsetParent!==null)nextQ()},fast?650:900);
  }else{
    $('stafbox').className='stafbox no';
    const h=hintFor(it);
    const notes=[{...it,x:230,col:'var(--bad)'}];
    if(h.land!==it.d)notes.unshift({c:it.c,d:h.land,x:150,col:'var(--land)',stem:false,label:'ориентир'});
    drawStaff($('qStaff'),notes,{fit:Q.pool});
    let wrong='';
    if(kind==='name')wrong=`Твой ответ: ${letName(v)}. `;
    if(kind==='key')wrong=v%7===it.d%7?`Нота та, но октава другая: нажата ${letName(v)} ${OCT_RU[Math.floor(v/7)]}. `:`Нажата ${letName(v)} ${OCT_RU[Math.floor(v/7)]}. `;
    if(kind==='mic'&&heardMidi!=null){const pc=heardMidi%12,want=midiOf(it.d)%12;wrong=pc===want?`Нота та, но октава не та (${heardMidi>midiOf(it.d)?'выше':'ниже'}). `:`Прозвучала ${midiName(heardMidi)}. `}
    $('fb').innerHTML=`<b>Это ${fullName(it.d)}</b><span class="why">${wrong}${h.text}</span>`;
    markAnswer(v,kind,false);
    $('nextBtn').classList.remove('hide');
  }
}
function markAnswer(v,kind,ok){
  const it=Q.cur;
  if(kind==='name'){const bs=$('ansNames').querySelectorAll('button');bs[v].className=ok?'ok':'no';if(!ok)bs[it.d%7].className='ok'}
  if(kind==='key'||(P().mode==='keys')){const q=d=>$('ansKeys').querySelector(`.w[data-d="${d}"]`);
    if(kind==='key'&&q(v))q(v).setAttribute('class','w '+(ok?'ok':'no'));
    if(!ok&&q(it.d)){q(it.d).setAttribute('class','w ok');const kb=$('ansKeys');kb.scrollTo({left:Q.kb.pos[it.d]-kb.clientWidth/2+16,behavior:'smooth'});const h=hintFor(it);if(h.land!==it.d&&q(h.land))q(h.land).setAttribute('class','w hint')}}
  if(P().mode==='mic'&&!ok)play(midiOf(it.d));
}
function midiName(m){const pcs=[0,2,4,5,7,9,11],pc=m%12,o=Math.floor(m/12)-1;const i=pcs.indexOf(pc);
  if(i<0){const l=pcs.indexOf(pc-1);return letName(l)+'-диез '+(OCT_RU[o]||'')}return letName(o*7+i)+' '+(OCT_RU[o]||'')}
$('nextBtn').onclick=()=>nextQ();
$('micSkip').onclick=()=>answer(null,'skip');

function finish(){
  stopMic();const p=P();p.sessions++;if(!p.days.includes(today()))p.days.push(today());if(p.days.length>400)p.days.shift();
  const ok=Q.log.filter(l=>l.ok),acc=Math.round(ok.length/Q.log.length*100),med=median(ok.map(l=>l.rt))/1000,fast=ok.filter(l=>l.rt<2000).length;
  const stars=acc>=95&&med<2?3:acc>=85&&med<3.5?2:acc>=65?1:0;
  $('resStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('resTitle').textContent=['Начало положено','Хорошо!','Отлично!','Блестяще!'][stars];
  $('resAcc').textContent=acc+'%';$('resTime').textContent=ok.length?med.toFixed(1):'—';$('resFast').textContent=fast;
  // weakest notes in this session
  const bad={};for(const l of Q.log){bad[l.k]=bad[l.k]||{n:0,miss:0,rt:[]};bad[l.k].n++;if(!l.ok)bad[l.k].miss++;else bad[l.k].rt.push(l.rt)}
  const weak=Object.entries(bad).filter(([k,v])=>v.miss||median(v.rt)>3000).sort((a,b)=>b[1].miss-a[1].miss||median(b[1].rt)-median(a[1].rt)).slice(0,4);
  if(weak.length){const items=weak.map(([k],i)=>{const it=parse(k);return {...it,x:90+i*70,col:'var(--bad)',stem:false,label:letName(it.d)}});
    const r=staffSVG(items);
    $('resWeak').innerHTML=`<b>Над этими ещё поработать</b><svg class="staff" viewBox="${r.vb}">${r.html}</svg><div class="small">Они будут попадаться чаще, пока не станут быстрыми.</div>`}
  else $('resWeak').innerHTML='<b>Ни одной ошибки и все ноты быстрые.</b> <span class="small">Тренажёр будет повторять их всё реже.</span>';
  const m=mastery(p.stage);

    $('goNext').onclick=()=>{p.stage++;save();showIntro()}}
  else $('resUnlock').classList.add('hide');
  save();show('result');
}

/* ============ microphone pitch detection (YIN) ============ */
async function startMic(){
  $('micState').textContent='Разреши доступ к микрофону…';
  try{
    const a=ac();const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=a.createMediaStreamSource(st),an=a.createAnalyser();an.fftSize=4096;src.connect(an);
    mic={st,an,buf:new Float32Array(4096),run:true,last:null,cnt:0,armAt:performance.now()+400};
    $('micState').textContent='Сыграй эту ноту на пианино';
    const loop=()=>{if(!mic||!mic.run)return;micTick();setTimeout(loop,45)};loop();
  }catch(e){$('micState').textContent='Микрофон недоступен ('+(e.name||e)+'). Открой сайт в Safari/Chrome и разреши микрофон, или выбери другой способ ответа.'}
}
function stopMic(){if(mic){mic.run=false;mic.st.getTracks().forEach(t=>t.stop());mic=null}}
function yin(buf,sr){
  const W=2048,minT=Math.floor(sr/2300),maxT=Math.min(Math.floor(sr/30),buf.length-W-1);
  let rms=0;for(let i=0;i<W;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/W);if(rms<0.008)return {f:0,rms};
  const d=new Float32Array(maxT+1);
  for(let t=1;t<=maxT;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x}d[t]=s}
  let run=0,tau=-1;const c=new Float32Array(maxT+1);c[0]=1;
  for(let t=1;t<=maxT;t++){run+=d[t];c[t]=run?d[t]*t/run:1}
  for(let t=minT;t<=maxT;t++){if(c[t]<0.12){while(t+1<=maxT&&c[t+1]<c[t])t++;tau=t;break}}
  if(tau<0){let m=1;for(let t=minT;t<=maxT;t++)if(c[t]<m){m=c[t];tau=t}if(m>0.3)return {f:0,rms}}
  const a=c[tau-1]??c[tau],b=c[tau],e=c[tau+1]??c[tau];const den=a-2*b+e;const sh=den?0.5*(a-e)/den:0;
  return {f:sr/(tau+sh),rms};
}
function micTick(){
  const m=mic;m.an.getFloatTimeDomainData(m.buf);const {f,rms}=yin(m.buf,AC.sampleRate);
  $('micLvl').style.width=Math.min(100,rms*600)+'%';
  if(!Q||Q.locked||performance.now()<m.armAt){m.last=null;m.cnt=0;return}
  if(!f){m.cnt=0;m.last=null;return}
  const midi=Math.round(69+12*Math.log2(f/440));
  if(midi<21||midi>108)return;
  if(midi===m.last)m.cnt++;else{m.last=midi;m.cnt=1}
  $('micNote').textContent=midiName(midi);
  if(m.cnt>=3){m.cnt=0;m.armAt=performance.now()+1200;answer(null,'mic',midi)}
}

  const T=all.filter(i=>i.c==='T').sort((a,b)=>a.d-b.d),B=all.filter(i=>i.c==='B').sort((a,b)=>a.d-b.d);
  const block=(arr,title)=>{const per=10,out=[];for(let i=0;i<arr.length;i+=per){const ch=arr.slice(i,i+per);const ns=ch.map((it,j)=>({...it,x:76+j*28,col:col(it),stem:false}));const r=staffSVG(ns);
      out.push(`<svg class="staff" viewBox="${r.vb}">${r.html}</svg>`)}return `<div class="card" style="padding:6px"><b style="padding:6px;display:block">${title}</b>${out.join('')}</div>`};
  const slow=Object.entries(P().items).filter(([k,r])=>r.rt.length).map(([k,r])=>[k,median(r.rt)]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('pageBody').innerHTML=`<div class="legend"><span><i style="background:var(--good)"></i>знаю</span><span><i style="background:var(--gold)"></i>почти</span><span><i style="background:var(--bad)"></i>путаю</span><span><i style="background:var(--muted)"></i>ещё не было</span></div>`+
    block(T,'Скрипичный ключ')+block(B,'Басовый ключ')+
    (slow.length?`<div class="card"><b>Самые медленные</b><ul class="tips small">${slow.map(([k,ms])=>{const it=parse(k);return `<li>${fullName(it.d)} (${it.c==='T'?'скрипичный':'басовый'}) — ${(ms/1000).toFixed(1)} с</li>`}).join('')}</ul></div>`:'');
};

/* ============ how-to page ============ */
$('howBtn').onclick=()=>{
  show('page');$('pageTitle').textContent='Как учить';
  $('pageBody').innerHTML=`<div class="card"><ul class="tips">
  <li><b>Ориентиры вместо стишков.</b> Стишки и подсчёт линеек дают верный ответ, но медленно — во время игры на это нет времени. Быстро читают от нескольких выученных нот: какая ближайшая и насколько выше или ниже.</li>
  <li><b>Добавочные линейки не считают.</b> В исследовании японских пианистов (Frontiers in Psychology, 2018) одиночную ноту уверенно читали до трёх добавочных линеек — по форме, а не подсчётом. Поэтому тренажёр добавляет их постепенно, начиная с «до» на второй добавочной.</li>
  <li><b>Скорость — часть знания.</b> Нота считается выученной, только когда ответ верный и быстрый (меньше 3 секунд). Медленные ноты попадаются чаще.</li>
  <li><b>Ошибка возвращается через три ноты.</b> Так исправление закрепляется, пока оно свежее.</li>
  <li><b>Коротко и каждый день.</b> 20 нот — это 3–5 минут. Пять дней по 5 минут дают больше, чем одно занятие на полчаса.</li>
  <li><b>Произноси вслух и играй.</b> Связь «нота на стане → клавиша под пальцем» нужна для игры, поэтому есть режимы «Клавиша» и «Живое пианино».</li>
  <li><b>Средние добавочные</b> (уровень 6) — частая путаница: та же нота пишется в другом ключе. Начинай их, когда уровни 1–5 зелёные на карте.</li></ul></div>`;
};

/* ============ settings & data ============ */
$('setBtn').onclick=()=>{
  show('page');$('pageTitle').textContent='Настройки и данные';const p=P();
  $('pageBody').innerHTML=`<div class="card">
    <div class="small">Названия нот</div><div class="seg" id="nmSeg"><button data-v="0">до ре ми</button><button data-v="1">C D E</button></div>
    <div style="height:10px"></div><div class="small">Звук</div><div class="seg" id="sdSeg"><button data-v="1">вкл</button><button data-v="0">выкл</button></div>
    <div style="height:10px"></div><button class="btn sec" id="renBtn">Переименовать «${p.name}»</button>
    <div style="height:8px"></div><button class="btn sec" id="rstBtn">Сбросить прогресс «${p.name}»</button>
  </div>
  <div class="card"><b>Сохранение</b><p class="small">Прогресс хранится в этом браузере. Раз в неделю сохраняй копию — или перенеси данные на другой телефон.</p>
    <button class="btn sec" id="fileBtn">Сохранить копию в файл</button><div style="height:8px"></div>
    <button class="btn sec" id="copyBtn">Скопировать данные</button><div style="height:8px"></div>
    <textarea id="dataTa" placeholder="Вставь сюда скопированные данные…"></textarea><div style="height:8px"></div>
    <button class="btn sec" id="pasteBtn">Загрузить из текста выше</button>
    <div style="height:8px"></div><label class="btn sec" style="text-align:center">Загрузить из файла<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden></label>
  </div>`;
  const seg=(id,v,f)=>$(id).querySelectorAll('button').forEach(b=>{b.classList.toggle('on',+b.dataset.v===v);b.onclick=()=>{f(+b.dataset.v);save();$('setBtn').onclick()}});
  seg('nmSeg',S.cfg.en?1:0,v=>S.cfg.en=!!v);seg('sdSeg',S.cfg.sound?1:0,v=>S.cfg.sound=!!v);
  $('renBtn').onclick=()=>{const n=prompt('Новое имя',p.name);if(n){p.name=n.trim().slice(0,20);save();$('setBtn').onclick()}};
  $('rstBtn').onclick=()=>{if(confirm('Стереть весь прогресс «'+p.name+'»?')){Object.assign(p,blankProfile(p.name));save();toast('Прогресс сброшен')}};
  $('fileBtn').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='noty-'+today()+'.json';a.click()};
  $('copyBtn').onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast('Скопировано')}catch(e){$('dataTa').value=t;$('dataTa').select();toast('Выдели и скопируй текст')}};
  const imp=t=>{try{const s=JSON.parse(t);if(!s.profiles)throw 0;S=s;S.cfg=S.cfg||{en:false,sound:true};save();toast('Данные загружены');renderHome();show('home')}catch(e){toast('Не получилось прочитать данные')}};
  $('pasteBtn').onclick=()=>imp($('dataTa').value);
  $('fileIn').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(imp)};
};
$('backBtn').onclick=()=>{renderHome();show('home')};

renderHome();
</script>
</body>
